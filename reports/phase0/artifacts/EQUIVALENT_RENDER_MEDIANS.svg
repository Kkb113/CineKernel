<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CineKernel Phase 0.1 selected equivalent render-command medians</title>
  <desc id="desc">Horizontal bars compare Remotion, HyperFrames, and native median render-command times for typography, 3D, and mixed workloads.</desc>
  <rect width="1200" height="720" fill="#08111f"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Equivalent render-command medians</text>
  <text x="60" y="94" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Canonical full run · lower is faster · milliseconds · implementation 0249b40</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#cbd5e1">
    <rect x="60" y="120" width="16" height="16" rx="3" fill="#fb7185"/><text x="84" y="134">Remotion</text>
    <rect x="190" y="120" width="16" height="16" rx="3" fill="#60a5fa"/><text x="214" y="134">HyperFrames</text>
    <rect x="345" y="120" width="16" height="16" rx="3" fill="#34d399"/><text x="369" y="134">Native</text>
  </g>
  <g stroke="#243247" stroke-width="1">
    <line x1="300" y1="160" x2="300" y2="650"/><line x1="500" y1="160" x2="500" y2="650"/><line x1="700" y1="160" x2="700" y2="650"/><line x1="900" y1="160" x2="900" y2="650"/>
  </g>
  <g fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">
    <text x="292" y="674">0</text><text x="480" y="674">10,000</text><text x="680" y="674">20,000</text><text x="880" y="674">30,000</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="60" y="205" fill="#f8fafc" font-size="21" font-weight="600">Typography / layout</text>
    <rect x="300" y="173" width="269.5" height="22" rx="5" fill="#fb7185"/><text x="578" y="190" fill="#fecdd3" font-size="14">13,474.7</text>
    <rect x="300" y="203" width="260.4" height="22" rx="5" fill="#60a5fa"/><text x="569" y="220" fill="#bfdbfe" font-size="14">13,017.7</text>
    <rect x="300" y="233" width="83.1" height="22" rx="5" fill="#34d399"/><text x="392" y="250" fill="#a7f3d0" font-size="14">4,155.3</text>

    <text x="60" y="365" fill="#f8fafc" font-size="21" font-weight="600">3D scene</text>
    <rect x="300" y="333" width="401.6" height="22" rx="5" fill="#fb7185"/><text x="710" y="350" fill="#fecdd3" font-size="14">20,082.3</text>
    <rect x="300" y="363" width="307.1" height="22" rx="5" fill="#60a5fa"/><text x="616" y="380" fill="#bfdbfe" font-size="14">15,357.4</text>
    <rect x="300" y="393" width="102.5" height="22" rx="5" fill="#34d399"/><text x="411" y="410" fill="#a7f3d0" font-size="14">5,123.0</text>

    <text x="60" y="525" fill="#f8fafc" font-size="21" font-weight="600">Mixed 2D / 3D</text>
    <rect x="300" y="493" width="709.4" height="22" rx="5" fill="#fb7185"/><text x="1018" y="510" fill="#fecdd3" font-size="14">35,470.6</text>
    <rect x="300" y="523" width="482.7" height="22" rx="5" fill="#60a5fa"/><text x="791" y="540" fill="#bfdbfe" font-size="14">24,132.6</text>
    <rect x="300" y="553" width="212.5" height="22" rx="5" fill="#34d399"/><text x="521" y="570" fill="#a7f3d0" font-size="14">10,624.9</text>
  </g>
  <text x="60" y="705" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Semantic equivalence, not pixel identity. HyperFrames preflight and artifact verification are excluded here and reported separately.</text>
</svg>
