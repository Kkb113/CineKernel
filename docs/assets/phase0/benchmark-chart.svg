<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Full mixed 2D/3D median elapsed time</title>
  <desc id="desc">Native wgpu 10.17 seconds, Remotion 23.94 seconds, HyperFrames 38.93 seconds. Values are from verified successful attempts and are not visual-quality equivalence claims.</desc>
  <rect width="960" height="540" fill="#07101f"/>
  <text x="64" y="64" fill="#e8f7ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Full mixed 2D/3D median elapsed time</text>
  <text x="64" y="96" fill="#91a7bd" font-family="Arial, sans-serif" font-size="16">1920×1080 · 30 fps · successful retained attempts · lower is faster</text>
  <line x1="220" y1="130" x2="220" y2="430" stroke="#36506b" stroke-width="2"/>
  <line x1="220" y1="430" x2="900" y2="430" stroke="#36506b" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#e8f7ff">
    <text x="64" y="194">Native wgpu</text>
    <text x="64" y="294">Remotion</text>
    <text x="64" y="394">HyperFrames</text>
  </g>
  <rect x="220" y="160" width="173" height="48" rx="8" fill="#65d6ff"/>
  <rect x="220" y="260" width="407" height="48" rx="8" fill="#8b5cf6"/>
  <rect x="220" y="360" width="662" height="48" rx="8" fill="#d36cff"/>
  <g font-family="Arial, sans-serif" font-size="19" fill="#e8f7ff" font-weight="700">
    <text x="407" y="191">10.17 s</text>
    <text x="641" y="291">23.94 s</text>
    <text x="896" y="391" text-anchor="end">38.93 s</text>
