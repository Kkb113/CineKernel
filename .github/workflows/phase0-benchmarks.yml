name: Phase 0 benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Canonical benchmark profile
        type: choice
        options: [smoke, full]
        default: smoke
        required: true
      engine:
        description: Engine selection
        type: choice
        options: [all, remotion, hyperframes, native-2d, native-wgpu]
        default: all
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    name: canonical-${{ inputs.profile }}-${{ inputs.engine }} (${{ matrix.os }})
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          ffmpeg-version: release

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture environment and dependencies
        run: cargo xtask doctor --json

      - name: Synchronize pinned upstream source
        run: cargo xtask upstream sync

      - name: Verify pinned upstream source
        run: cargo xtask upstream verify --json

      - name: Prepare deterministic fixtures
        run: cargo xtask phase0 prepare --json

      - name: Detect native wgpu capability
        id: gpu
        if: inputs.engine == 'all' || inputs.engine == 'native-wgpu'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .cinekernel/capabilities | Out-Null
          $output = & cargo run --release --package phase0-native-wgpu -- --case 3d-scene --profile smoke --output .cinekernel/capabilities/unused.mp4 --capability-only 2>&1
          $exit = $LASTEXITCODE
          $text = $output -join "`n"
          $text | Out-File .cinekernel/capabilities/native-wgpu.txt
          if ($exit -ne 0) {
            if ($text -match 'no wgpu adapter available') {
              'supported=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              'native-wgpu: UNSUPPORTED (no adapter available)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              exit 0
            }
            Write-Output $text
            exit $exit
          }
          $json = $output | Where-Object { $_ -match '^\s*\{' } | Select-Object -Last 1 | ConvertFrom-Json
          $supported = $json.gpu_active -eq $true -and $json.software_fallback -ne $true
          "supported=$($supported.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $supported) {
            "native-wgpu: UNSUPPORTED ($($json.device_type) adapter is not hardware GPU execution)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Run selected canonical benchmark
        if: inputs.engine != 'native-wgpu' || steps.gpu.outputs.supported == 'true'
        shell: pwsh
        run: |
          $arguments = @('xtask','phase0','canonical-run','--profile','${{ inputs.profile }}','--timeout-seconds','7200','--stall-seconds','1800','--json')
          $workerCount = [Environment]::ProcessorCount
          if ($workerCount -lt 1) {
            throw 'Unable to determine an available worker count'
          }
          $arguments += @('--max-worker-count', "$workerCount")
          "Canonical worker capability: $workerCount" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ('${{ runner.os }}' -eq 'macOS') {
            $env:CINEKERNEL_REMOTION_GL = 'angle'
            'Remotion graphics backend: angle' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if ('${{ inputs.engine }}' -ne 'all') {
            $arguments += @('--engine','${{ inputs.engine }}')
          }
          if ('${{ inputs.engine }}' -eq 'all' -and '${{ steps.gpu.outputs.supported }}' -eq 'false') {
            $arguments += @('--exclude-engine','native-wgpu')
          }
          & cargo @arguments
          exit $LASTEXITCODE

      - name: Verify complete canonical matrix
        if: inputs.engine != 'native-wgpu' || steps.gpu.outputs.supported == 'true'
        run: cargo xtask phase0 verify --canonical --json

      - name: Run canonical correctness probes except Probe G
        if: inputs.profile == 'full' && inputs.engine == 'all'
        run: cargo xtask phase0 probes --canonical --exclude G --json

      - name: Generate canonical reports
        if: always() && (inputs.engine != 'native-wgpu' || steps.gpu.outputs.supported == 'true')
        run: cargo xtask phase0 report --canonical --json

      - name: Upload canonical benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-${{ github.sha }}-${{ matrix.os }}-${{ inputs.profile }}-${{ inputs.engine }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            .cinekernel/runs/
            .cinekernel/logs/
            .cinekernel/environments/
            .cinekernel/projects/
            .cinekernel/probes/
            .cinekernel/capabilities/
            reports/phase0/CANONICAL_RUN_MANIFEST.json
            reports/phase0/CANONICAL_BASELINE_RESULTS.*
            reports/phase0/CORRECTNESS_PROBES.*
            reports/phase0/ARTIFACT_INDEX.md
            reports/phase0/VERIFIER_REPORT.md
